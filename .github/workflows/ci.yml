name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual-only trigger for the `release` job below. Pushes/PRs never run it
  # (see that job's own `if: false` gate — this is belt-and-suspenders until
  # NPM_TOKEN is actually configured and publishing is intentionally enabled).
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: Build wasm32-wasip1 plugin (release)
        run: cargo build --release --target wasm32-wasip1 -p meonode-swc-plugin

      # TODO: enable once @meonode/ui ref is cloneable in CI.
      #
      # crates/meonode-swc-plugin/src/css_props.rs is generated from
      # @meonode/ui via `bun run codegen` (scripts/codegen-css-set.ts), which
      # shells out to `bun run export:css-props` in a checkout of
      # @meonode/ui (path via MEONODE_UI_DIR, default ../ui). This CI job
      # only checks out this repo, so there is no ../ui to diff against and
      # this step is a no-op placeholder (`if: false`) until @meonode/ui has
      # a ref this workflow can check out (a public remote, a pinned commit
      # via a private-repo checkout with a deploy key, or a vendored
      # snapshot). Once that exists: check out @meonode/ui alongside this
      # repo, drop the `if: false`, and this step will fail the build on any
      # drift between the two repos' CSS property sets via
      # `bun run check:drift`.
      - name: CSS prop set drift check (disabled — see TODO above)
        if: false
        run: bun run check:drift

  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm32-wasip1 plugin (release)
        run: bun run build:wasm

      # Loads the built artifact through @swc/core's real plugin host
      # (see tests/wasm-smoke.test.ts) — proves the crate's swc_core ABI
      # is compatible with @swc/core's, which `cargo build` alone can't.
      - name: WASM artifact smoke tests
        run: bun run test

  # Task 12: builds the e2e/next-app (Next 16, Turbopack) and e2e/vite-app
  # fixtures twice each (plugin on/off) and asserts HTML/DOM parity — see
  # e2e/scripts/run-e2e.mjs. Slow (real bundler builds), so its own job
  # rather than folded into `wasm-smoke`.
  #
  # TODO: enable once @meonode/ui ref is cloneable in CI (same blocker as the
  # disabled CSS prop set drift check in the `test` job above) — both e2e
  # fixtures depend on `@meonode/ui: file:../../../ui`, which needs a real
  # ../ui checkout as a sibling of this repo's checkout.
  e2e:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: compiler

      - uses: actions/checkout@v4
        with:
          repository: meonode/ui
          path: ui

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build @meonode/ui
        working-directory: ui
        run: bun install --frozen-lockfile && bun run build

      - name: Build wasm32-wasip1 plugin (release)
        working-directory: compiler
        run: bun install --frozen-lockfile && bun run build:wasm

      - name: E2E fixtures (Next Turbopack + Vite parity)
        working-directory: compiler
        run: bun run test:e2e

  # Task 13: release job SKELETON. NOT wired up — automation is intentionally
  # not enabled yet (see README > Development > Publishing: no semantic-release,
  # manual version bump + `npm publish` for now). This exists so the actual
  # publish steps are reviewable and ready to flip on later, not so it runs.
  #
  # To actually enable this job:
  #   1. Remove the `if: false` gate below (the `workflow_dispatch`-only
  #      trigger on its own is not considered a sufficient safeguard against
  #      accidental runs, hence the extra explicit gate).
  #   2. TODO: add an `NPM_TOKEN` repo secret (an npm automation/publish token
  #      for the `@meonode` org) and reference it below as `NODE_AUTH_TOKEN`.
  #   3. TODO: decide on a real versioning story (manual bump vs.
  #      semantic-release) before the first publish — `npm/package.json` is
  #      currently pinned to the placeholder `0.0.0-dev.0`.
  #   4. TODO: gate this job on a git tag or manual version input rather than
  #      just `workflow_dispatch`, so a publish can't happen without an
  #      explicit version decision.
  release:
    runs-on: ubuntu-latest
    if: false # TODO: remove once NPM_TOKEN is configured and publishing is intentionally enabled
    needs: [test, wasm-smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm32-wasip1 plugin (release) + copy README into npm/
        run: bun run build:wasm

      - name: Set up Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # TODO: requires the NPM_TOKEN secret referenced above. `--access
      # public` is required the first time a new scoped package is
      # published; harmless on subsequent publishes.
      - name: npm publish (from npm/)
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
