name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual-only trigger for the `release` job below. Pushes/PRs never run it
  # (see that job's own `if: false` gate — this is belt-and-suspenders until
  # npm OIDC trusted publishing is actually configured and publishing is
  # intentionally enabled).
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: Build wasm32-wasip1 plugin (release)
        run: cargo build --release --target wasm32-wasip1 -p meonode-swc-plugin

  # CSS prop set + factory table drift check against @meonode/ui
  # (https://github.com/l7aromeo/meonode-ui, public). Split out from `test`
  # rather than folded in: crates/meonode-swc-plugin/src/css_props.rs and
  # .../factories.rs are generated from a sibling @meonode/ui checkout
  # (scripts/codegen-css-set.ts and scripts/codegen-factories.ts default
  # MEONODE_UI_DIR to "../ui" relative to this repo's root — see those
  # scripts), which needs both a `ui` checkout and bun, neither of which
  # `cargo test` in `test` needs. Keeping them apart means `test` stays a
  # fast Rust-only job and this one doesn't touch the Rust toolchain at all.
  #
  # Checked out at `ref: beta`, same as the `e2e` job below: ui's
  # `export:css-props` script (scripts/export-css-properties.ts), which this
  # job's `bun run check:drift` shells out to, only exists on that branch —
  # `error: Script not found "export:css-props"` against ui's default branch.
  # Move this to ui's default branch once it merges there.
  css-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compiler

      - uses: actions/checkout@v4
        with:
          repository: l7aromeo/meonode-ui
          ref: beta
          path: ui

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        working-directory: compiler
        run: bun install --frozen-lockfile

      # `bun run check:drift` shells out to `bun run export:css-props` in
      # ../ui (this job's `ui` checkout, a sibling of `compiler`), which reads
      # straight from ui's src/constant/css-properties.const.ts via bun's
      # native tsconfig path-alias resolution — no `bun install`/build needed
      # in the `ui` checkout itself, unlike the `e2e` job below which needs
      # ui's actual built package.
      - name: CSS prop set + factory table drift check
        working-directory: compiler
        run: bun run check:drift

  wasm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm32-wasip1 plugin (release)
        run: bun run build:wasm

      # Loads the built artifact through @swc/core's real plugin host
      # (see tests/wasm-smoke.test.ts) — proves the crate's swc_core ABI
      # is compatible with @swc/core's, which `cargo build` alone can't.
      - name: WASM artifact smoke tests
        run: bun run test

  # Task 12: builds the e2e/next-app (Next 16, Turbopack) and e2e/vite-app
  # fixtures twice each (plugin on/off) and asserts HTML/DOM parity — see
  # e2e/scripts/run-e2e.mjs. Slow (real bundler builds), so its own job
  # rather than folded into `wasm-smoke`.
  #
  # No @meonode/ui checkout needed here (unlike `css-drift` above): the e2e
  # fixtures depend on @meonode/ui via an exact npm registry pin
  # (`1.7.0-beta.1`, the `beta` dist-tag — see e2e/next-app/package.json,
  # e2e/vite-app/package.json, and the README > Development note on bumping
  # it), installed like any other dependency by `bun install` inside
  # e2e/scripts/run-e2e.mjs. Bump that pin (and re-run `bun run test:e2e`
  # locally) whenever @meonode/ui cuts a new relevant `beta` build.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build wasm32-wasip1 plugin (release)
        run: bun install --frozen-lockfile && bun run build:wasm

      - name: E2E fixtures (Next Turbopack + Vite parity)
        run: bun run test:e2e

  # Task 13: release job SKELETON. NOT wired up — automation is intentionally
  # not enabled yet (see README > Development > Publishing: no semantic-release,
  # manual version bump + `npm publish` for now). This exists so the actual
  # publish steps are reviewable and ready to flip on later, not so it runs.
  #
  # Publish step mirrors @meonode/ui's own release workflow's approach: npm
  # OIDC trusted publishing (`id-token: write` permission + setup-node's
  # `registry-url` + `npm audit signatures`), not a long-lived `NPM_TOKEN`
  # secret — see
  # https://github.com/l7aromeo/meonode-ui/blob/main/.github/workflows/release.yml
  #
  # To actually enable this job:
  #   1. Remove the `if: false` gate below (the `workflow_dispatch`-only
  #      trigger on its own is not considered a sufficient safeguard against
  #      accidental runs, hence the extra explicit gate).
  #   2. TODO: configure npm OIDC trusted publishing for the `@meonode` org/
  #      package on npmjs.com (Settings > Publishing access > add this repo +
  #      workflow as a trusted publisher). No repo secret is needed —
  #      `id-token: write` below is sufficient once that's configured.
  #   3. TODO: decide on a real versioning story (manual bump vs.
  #      semantic-release) before the first publish — `npm/package.json` is
  #      currently pinned to the placeholder `0.0.0-dev.0`.
  #   4. TODO: gate this job on a git tag or manual version input rather than
  #      just `workflow_dispatch`, so a publish can't happen without an
  #      explicit version decision.
  release:
    runs-on: ubuntu-latest
    if: false # TODO: remove once npm OIDC trusted publishing is configured and publishing is intentionally enabled
    needs: [test, wasm-smoke]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm32-wasip1 plugin (release) + copy README into npm/
        run: bun run build:wasm

      - name: Set up Node for npm publish (OIDC trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify provenance attestations
        run: npm audit signatures

      # No NODE_AUTH_TOKEN / NPM_TOKEN: npm OIDC trusted publishing
      # authenticates via the `id-token: write` permission above plus the
      # registry-url configured by setup-node, no long-lived npm token
      # secret needed. `--access public` is required the first time a new
      # scoped package is published; harmless on subsequent publishes.
      - name: npm publish (from npm/)
        working-directory: npm
        run: npm publish --access public
